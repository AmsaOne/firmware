; LilyGo T-Dongle C5 — single-MCU wardriver targeting wdgwars.pl
; Hardware: ESP32-C5HR8 (rev v1.0, ECO2), ST7735 80x160 IPS LCD,
; APA102 RGB LED, MicroSD (SPI), single BOOT button, USB Type-A male.

[env:lilygo-t-dongle-c5]
board = esp32-c5-devkitc-1
board_build.partitions = custom_8Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/lilygo-t-dongle-c5>

; Override the bmorcelli custom Arduino-ESP32 libs (which break SD-on-SPI for
; ESP32-C5 — confirmed via process of elimination after every firmware-layer
; fix failed) with the STOCK Espressif Arduino-ESP32 3.3.6 libs that LilyGo's
; own SD_Test.ino is verified against on this exact hardware. Other Bruce
; environments (m5stack, t-embed, etc.) inherit the [env].platform_packages
; line and continue to use the bmorcelli build, so they retain access to
; raw-TX-dependent attack modules (deauth/evil-twin/etc.). This T-Dongle build
; trades raw-TX for a working SD card — for a wardriver, that's the right
; trade. See the audit plan at ~/.claude/plans/you-are-an-auditor-flickering-wirth.md
platform_packages =
	framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.6/esp32-core-3.3.6-libs.tar.xz

build_flags =
	${env.build_flags}
	-Iboards/lilygo-t-dongle-c5

	-DLILYGO_T_DONGLE_C5=1
	-DDEVICE_NAME='"T-Dongle-C5"'
	-DBOARD_HAS_PSRAM=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=1

	; Skip Bruce modules that depend on the bmorcelli libs' raw-TX patches
	; (deauth, evil-twin, custom 802.11 frame injection). Required when using
	; the stock Espressif libs above. Bruce already has #if !defined(LITE_VERSION)
	; guards in place — this flag activates them.
	-DLITE_VERSION=1

	; ===== ST7735 80x160 portrait, mini-greentab variant, BGR =====
	-DUSER_SETUP_LOADED=1
	-DST7735_DRIVER=1
	-DST7735_GREENTAB160x80
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_WIDTH=80
	-DTFT_HEIGHT=160
	-DTFT_MISO=-1
	-DTFT_MOSI=2
	-DTFT_SCLK=6
	-DTFT_CS=10
	-DTFT_DC=3
	-DTFT_RST=1
	-DTFT_BL=0
	-DTFT_BACKLIGHT_ON=LOW         ; SI2301 P-MOSFET → backlight ON when GPIO0 = LOW
	-DSMOOTH_FONT=1
	; HW SPI to GPIO 2 doesn't drive this panel on ESP32-C5 silicon; we
	; bit-bang the boot splash + LED in interface.cpp instead. TFT_eSPI's
	; calls during Bruce's normal flow are silent no-ops on this hardware
	; (won't render visible pixels). See Adafruit-ST7735-swap-plan.md.
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000
	-DTOUCH_CS=-1

	; small text on small screen
	-DFP=1
	-DFM=1
	-DFG=2

	; UI control aliases
	-DBTN_ALIAS='"Boot"'

	; user is allowed to assign any free GPIO for IR/RF later
	-DALLOW_ALL_GPIO_FOR_IR_RF=1

	; ----- T-Dongle-specific feature flags -----
	-DBRUCE_AP_MODE_DEFAULT=1       ; boot directly into softAP, do not try STA-then-fallback
	-DBRUCE_GPS_UDP=1               ; compile the UDP-NMEA GPS provider
	-DBRUCE_REST_HANDOFF=1          ; compile the iOS-Shortcut REST endpoints
	-DBRUCE_AUTOSTART_WARDRIVE=1    ; start wardrive on boot when GPS is valid
	; Reverted: BRUCE_SD_FORCE_DEDICATED_SPI and BRUCE_SKIP_TFT_INIT were
	; experimental workarounds. After SPIFFS erase fixed the wrong pin config,
	; and stock libs are in use, the original Bruce SD path (which uses
	; tft.getSPIinstance() — TFT_eSPI's already-initialized FSPI handle) is
	; the one that mirrors LilyGo's working factory firmware.

lib_deps = ${env.lib_deps}
